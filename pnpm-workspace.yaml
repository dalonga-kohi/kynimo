packages:
  - "apps/*"
  - "packages/*"
# GHSA-g3hv-75wg-m249: minimatch 7 to 11.0.0 can be stalled by a crafted glob. Only
# electron-builder's build-time tree pulls those versions in; remove once it moves on.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "^11.0.2"
allowBuilds:
  electron: true
  electron-winstaller: false
minimumReleaseAgeExclude:
  - electron@45.3.2
