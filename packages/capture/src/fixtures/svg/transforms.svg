<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <title>transforms</title>
  <g transform="translate(20 20)">
    <rect width="60" height="40" fill="#e74c3c"/>
    <g transform="translate(80 0) rotate(20 30 20)">
      <rect width="60" height="40" fill="#3498db"/>
      <g transform="scale(0.5 1.5)">
        <circle cx="30" cy="20" r="14" fill="#f1c40f"/>
      </g>
    </g>
  </g>
  <g transform="translate(20 100) skewX(30)">
    <rect width="70" height="50" fill="#2ecc71"/>
  </g>
  <g transform="translate(140 100) scale(1.5 0.8) rotate(-15)">
    <rect width="60" height="50" fill="#9b59b6" stroke="#000" stroke-width="3"/>
  </g>
  <g transform="rotate(90 160 160)" opacity="0.5">
    <rect x="230" y="40" width="50" height="50" fill="#1abc9c"/>
  </g>
  <g transform="translate(230 140) rotate(30) scale(1.2)">
    <rect width="40" height="40" fill="#e67e22" opacity="0.6"/>
    <rect x="25" y="10" width="40" height="40" fill="#2980b9" opacity="0.6"/>
  </g>
  <g transform="translate(20 220)">
    <g transform="rotate(10)">
      <g transform="translate(40 0) skewX(-20)">
        <g transform="scale(1.3)">
          <path d="M 0 0 L 50 0 L 25 40 Z" fill="#c0392b"/>
        </g>
      </g>
    </g>
  </g>
  <g transform="matrix(1 0 0 1 150 230)">
    <g transform="matrix(0.866 0.5 -0.5 0.866 0 0)">
      <rect width="60" height="40" fill="#34495e" opacity="0.8"/>
    </g>
  </g>
  <g transform="translate(250 240)" opacity="0.4">
    <circle r="30" fill="#e84393"/>
  </g>
</svg>
