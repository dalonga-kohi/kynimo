name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json "packageManager"; v6.1+ supports pnpm 12.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The compositor tests run in the pinned Chromium on SwiftShader (ADR-0016, ADR-0021).
      - run: pnpm --filter @kynimo/renderer exec playwright install --with-deps chromium

      - run: pnpm check
