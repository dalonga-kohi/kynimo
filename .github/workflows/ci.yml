name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres for the store's multi-process tests (ADR-0029); PGlite covers the rest.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kynimo
          POSTGRES_DB: kynimo_test
          # A disposable service container: no password, so no credential lives in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kynimo -d kynimo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      KYNIMO_TEST_DATABASE_URL: postgresql://kynimo@localhost:5432/kynimo_test
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json "packageManager"; v6.1+ supports pnpm 12.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runner apt mirrors fail transiently (DNS); retry each download instead of failing the run.
      - run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries

      # The compositor tests run in the pinned Chromium on SwiftShader (ADR-0016, ADR-0021).
      # The browser is cached per Playwright version; its system libraries come from apt each run.
      # @kynimo/capture launches the same browser, so its `playwright` pin must match renderer's.
      - id: playwright
        run: |
          v=$(pnpm --filter @kynimo/renderer exec playwright --version | awk '{print $2}')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @kynimo/renderer exec playwright install chromium

      # Chromium's libraries and the system FFmpeg (ADR-0032, for the media tests), with a whole-step
      # retry for mirror outages longer than apt's own retries.
      - timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @kynimo/renderer exec playwright install-deps chromium &&
              sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            echo "apt attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1

      - run: pnpm check
