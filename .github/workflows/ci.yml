name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres for the store's multi-process tests (ADR-0029); PGlite covers the rest.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kynimo
          POSTGRES_DB: kynimo_test
          # A disposable service container: no password, so no credential lives in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kynimo -d kynimo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      KYNIMO_TEST_DATABASE_URL: postgresql://kynimo@localhost:5432/kynimo_test
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json "packageManager"; v6.1+ supports pnpm 12.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The compositor tests run in the pinned Chromium on SwiftShader (ADR-0016, ADR-0021).
      - run: pnpm --filter @kynimo/renderer exec playwright install --with-deps chromium

      - run: pnpm check
